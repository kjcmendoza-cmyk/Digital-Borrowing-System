<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUSEE - EE Laboratory Portal</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-[#ebf2fe] flex items-center justify-center min-h-screen p-4 relative overflow-hidden selection:bg-blue-600 selection:text-white">

    <!-- Ambient Glowing Orbs in Background -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-400/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-indigo-400/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Login Card Container -->
    <div class="relative bg-white/90 backdrop-blur-md p-8 sm:p-10 rounded-3xl shadow-2xl shadow-blue-900/10 w-full max-w-sm sm:max-w-md text-center border border-white/80">
        
        <!-- FUSEE Logo -->
        <div class="mb-5 flex justify-center items-center">
            <img src="fusee-logo.png" alt="FUSEE Logo" class="h-28 sm:h-36 w-auto object-contain filter drop-shadow-md transition-transform duration-300 hover:scale-105"
                 onerror="if (this.src.endsWith('fusee-logo.png')) { this.src='fusee-logo.PNG'; } else if (this.src.endsWith('fusee-logo.PNG')) { this.src='FUSEE-logo.png'; }">
        </div>

        <!-- Pill Badge with Subtle Pulse -->
        <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-blue-50/80 border border-blue-200/60 text-blue-700 text-[11px] font-bold tracking-wider uppercase mb-5 shadow-xs">
            <span class="text-amber-500 animate-pulse text-xs">⚡</span>
            <span>ELECTRICAL ENGINEERING LABORATORY PORTAL</span>
        </div>

        <!-- Eye-Catching Gradient Title -->
        <div class="mb-6 space-y-2">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight leading-tight">
                <span class="bg-gradient-to-r from-blue-700 via-indigo-600 to-blue-900 bg-clip-text text-transparent">
                    Laboratory Tool
                </span>
                <br>
                <span class="text-slate-800">
                    Management System
                </span>
            </h1>

            <p class="text-[11px] sm:text-xs text-slate-500 font-semibold tracking-wide uppercase max-w-[280px] mx-auto pt-1">
                Federation of United Students of Electrical Engineering
            </p>
        </div>

        <!-- Student Profile Inputs -->
        <div class="mb-5 text-left space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                <input type="text" id="reg-name" required placeholder="e.g. Juan Dela Cruz" 
                       class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">ID Number</label>
                <input type="text" id="reg-id-number" required placeholder="e.g. 2023-12345" 
                       class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Course/Program</label>
                <select id="reg-course" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="" disabled selected>Select your program...</option>
                    <option value="BS Aerospace Engineering">BS Aerospace Engineering</option>
                    <option value="BS Architecture">BS Architecture</option>
                    <option value="BS Chemical Engineering">BS Chemical Engineering</option>
                    <option value="BS Civil Engineering">BS Civil Engineering</option>
                    <option value="BS Computer Engineering">BS Computer Engineering</option>
                    <option value="BS Electrical Engineering">BS Electrical Engineering</option>
                    <option value="BS Electronics Engineering">BS Electronics Engineering</option>
                    <option value="BS Industrial Engineering">BS Industrial Engineering</option>
                    <option value="BS Mechanical Engineering">BS Mechanical Engineering</option>
                    <option value="BS Robotics Engineering">BS Robotics Engineering</option>
                </select>
            </div>
        </div>

        <!-- Google OAuth Sign-in Button -->
        <button id="google-login-btn" class="w-full flex items-center justify-center gap-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 active:scale-[0.98] text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg shadow-blue-600/30 hover:shadow-blue-600/40 transition-all duration-200 cursor-pointer">
            <svg class="w-5 h-5 bg-white rounded-full p-0.5 shrink-0 shadow-xs" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <span class="text-sm tracking-wide">Sign in with AdDU Email</span>
        </button>

        <!-- Status Alerts -->
        <p id="error-message" class="mt-4 text-rose-600 text-xs font-semibold hidden"></p>
        <p id="loading-message" class="mt-4 text-blue-600 text-xs font-semibold hidden">Checking credentials...</p>
    </div>

    <!-- Firebase v13 Modular SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAjkdbUSY5yTqWmDVGWL_RSC0p2KbI49Rg",
            authDomain: "digital-borrowing-system.firebaseapp.com",
            projectId: "digital-borrowing-system",
            storageBucket: "digital-borrowing-system.firebasestorage.app",
            messagingSenderId: "446897129489",
            appId: "1:446897129489:web:8cc4aab0bbaef6b5ea49b0",
            measurementId: "G-R3BMR771SN"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        
        const loginBtn = document.getElementById('google-login-btn');
        const errorMsg = document.getElementById('error-message');
        const loadingMsg = document.getElementById('loading-message');

        const showError = (msg) => {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
            loadingMsg.classList.add('hidden');
        };

        loginBtn.addEventListener('click', async () => {
            try {
                errorMsg.classList.add('hidden');

                const nameInput = document.getElementById('reg-name').value.trim();
                const idInput = document.getElementById('reg-id-number').value.trim();
                const courseSelect = document.getElementById('reg-course');
                const courseInput = courseSelect ? courseSelect.value : '';

                if (!nameInput || !idInput || !courseInput) {
                    throw new Error("Please enter your Full Name, ID Number, and select a Course before signing in.");
                }

                loadingMsg.classList.remove('hidden');

                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                if (!user.email.endsWith('@addu.edu.ph')) {
                    await signOut(auth);
                    throw new Error("Access denied. Please use your @addu.edu.ph email.");
                }

                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        uid: user.uid,
                        email: user.email,
                        name: nameInput,
                        id_number: idInput,
                        course: courseInput,
                        role: 'student',
                        is_on_hold: false,
                        createdAt: new Date().toISOString()
                    });
                    window.location.href = 'student.html';
                } else {
                    await setDoc(userRef, {
                        name: nameInput,
                        id_number: idInput,
                        course: courseInput
                    }, { merge: true });
                    const userData = userSnap.data();
                    window.location.href = userData.role === 'admin' ? 'admin.html' : 'student.html';
                }
                
            } catch (error) {
                console.error("Login Error:", error);
                showError(error.message || "An error occurred during sign in.");
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user && user.email.endsWith('@addu.edu.ph')) {
                try {
                    loadingMsg.classList.remove('hidden');
                    loginBtn.disabled = true;

                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);

                    if (userSnap.exists()) {
                        const userData = userSnap.data();
                        if (userData.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'student.html';
                        }
                    } else {
                        loadingMsg.classList.add('hidden');
                        loginBtn.disabled = false;
                    }
                } catch (error) {
                    showError("Error fetching user data.");
                    await signOut(auth);
                }
            } else {
                loadingMsg.classList.add('hidden');
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
