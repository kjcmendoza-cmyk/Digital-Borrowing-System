<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EE Lab Inventory - Login</title>
    
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <!-- Login Container (Mobile First) -->
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md text-center">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-gray-900">EE Lab Inventory</h1>
            <p class="text-gray-500 mt-2">Sign in to access the system</p>
        </div>

        <button id="google-login-btn" class="w-full flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200">
            <svg class="w-5 h-5 bg-white rounded-full p-0.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with AdDU Google
        </button>

        <p id="error-message" class="mt-4 text-red-500 text-sm hidden"></p>
        <p id="loading-message" class="mt-4 text-blue-600 text-sm hidden">Checking credentials...</p>
    </div>

    <!-- Firebase v13 Modular SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";

        // 1. Firebase Configuration from provided image
        const firebaseConfig = {
            apiKey: "AIzaSyAjkdbUSY5yTqWmDVGWL_RSC0p2KbI49Rg",
            authDomain: "digital-borrowing-system.firebaseapp.com",
            projectId: "digital-borrowing-system",
            storageBucket: "digital-borrowing-system.firebasestorage.app",
            messagingSenderId: "446897129489",
            appId: "1:446897129489:web:8cc4aab0bbaef6b5ea49b0",
            measurementId: "G-R3BMR771SN"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        
        // UI Elements
        const loginBtn = document.getElementById('google-login-btn');
        const errorMsg = document.getElementById('error-message');
        const loadingMsg = document.getElementById('loading-message');

        const showError = (msg) => {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
            loadingMsg.classList.add('hidden');
        };

        // 2. Authentication & 3. Database Registration
        loginBtn.addEventListener('click', async () => {
            try {
                errorMsg.classList.add('hidden');
                loadingMsg.classList.remove('hidden');

                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Restrict login to @addu.edu.ph domain
                if (!user.email.endsWith('@addu.edu.ph')) {
                    await signOut(auth);
                    throw new Error("Access denied. Please use your @addu.edu.ph email.");
                }

                // Check if user exists in Firestore
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    // First time login -> Register to Firestore
                    await setDoc(userRef, {
                        uid: user.uid,
                        email: user.email,
                        role: 'student', // Default role
                        is_on_hold: false
                    });
                }
                
            } catch (error) {
                console.error("Login Error:", error);
                showError(error.message || "An error occurred during sign in.");
            }
        });

        // 4. The Bouncer (Auth State Listener)
        onAuthStateChanged(auth, async (user) => {
            if (user && user.email.endsWith('@addu.edu.ph')) {
                // User is signed in and has correct domain, fetch role
                try {
                    loadingMsg.classList.remove('hidden');
                    loginBtn.disabled = true;

                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);

                    if (userSnap.exists()) {
                        const userData = userSnap.data();
                        
                        // Route based on role
                        if (userData.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'student.html';
                        }
                    } else {
                        loadingMsg.classList.add('hidden');
                        loginBtn.disabled = false;
                    }
                } catch (error) {
                    showError("Error fetching user data.");
                    await signOut(auth);
                }
            } else {
                // No valid user signed in, stay on login page
                loadingMsg.classList.add('hidden');
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
